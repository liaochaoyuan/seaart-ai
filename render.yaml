# ============================================================
# Render 部署配置
# 在 render.com 连接本 GitHub 仓库后，Render 会自动按此配置构建。
# 注意：LLM_API_KEY / AGNES_API_KEY 为私密密钥，
#       请勿写死在仓库里，请在 Render 控制台的 Environment 中填写
#       （下方 sync:false 表示由控制台管理，不会被文件覆盖）。
# ============================================================
services:
  - type: web
    name: seaart-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DRAW_BACKEND
        value: zhipu
      - key: LLM_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
